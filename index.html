      // --- CUSTOM LANGUAGE DROPDOWN CÓ TÌM KIẾM ---
      function syncLangLabels() {
        sourceLangLabel.textContent = LANG_NAME_MAP[state.sourceLang] || state.sourceLang;
        targetLangLabel.textContent = LANG_NAME_MAP[state.targetLang] || state.targetLang;
      }
      syncLangLabels();

      function renderLangOptions(filterText = '') {
        const q = filterText.trim().toLowerCase();
        const isSource = state.activePickerType === 'source';
        const currentCode = isSource ? state.sourceLang : state.targetLang;

        const items = LANGUAGES.filter((lang) => {
          if (!isSource && lang.allowSourceOnly) return false;
          if (!q) return true;
          return (
            lang.name.toLowerCase().includes(q) ||
            lang.native.toLowerCase().includes(q) ||
            lang.code.toLowerCase().includes(q)
          );
        });

        if (items.length === 0) {
          langOptionsList.innerHTML = `<div class="px-2.5 py-4 text-center text-[12px] text-white/40">No language found</div>`;
          return;
        }

        langOptionsList.innerHTML = '';
        items.forEach((lang) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `lang-option-item ${lang.code === currentCode ? 'is-selected' : ''}`;
          btn.innerHTML = `
            <span class="truncate">${lang.name}</span>
            <span class="text-[11px] opacity-60 ml-2 shrink-0">${lang.native}</span>
          `;
          btn.addEventListener('click', (ev) => {
            ev.stopPropagation();
            if (isSource) {
              state.sourceLang = lang.code;
            } else {
              state.targetLang = lang.code;
            }
            syncLangLabels();
            closeLangDropdown();
            if (translateInput.value.trim()) queueTranslate(0);
          });
          langOptionsList.appendChild(btn);
        });
      }

      function positionLangDropdown(anchorBtn) {
        const rect = anchorBtn.getBoundingClientRect();
        const shellRect = nusaShell.getBoundingClientRect();
        const popWidth = Math.max(152, Math.round(rect.width));
        langDropdownPopover.style.width = `${popWidth}px`;

        const minLeft = Math.max(12, shellRect.left + 12);
        const maxLeft = Math.min(window.innerWidth - popWidth - 12, shellRect.right - popWidth - 12);
        const left = maxLeft >= minLeft ? Math.max(minLeft, Math.min(maxLeft, rect.left)) : Math.max(12, rect.left);

        const top = rect.bottom + 4;
        const availableInsideShell = Math.max(112, Math.floor(shellRect.bottom - top - 10));
        langDropdownPopover.style.maxHeight = `${Math.min(142, availableInsideShell)}px`;
        langDropdownPopover.style.left = `${left}px`;
        langDropdownPopover.style.top = `${top}px`;
      }

      function openLangDropdown(pickerType, anchorBtn) {
        if (state.activePickerType === pickerType && langDropdownPopover.classList.contains('is-open')) {
          closeLangDropdown();
          return;
        }
        state.activePickerType = pickerType;
        state.suppressAutoFocus = false;
        langSearchInput.value = '';
        renderLangOptions('');
        positionLangDropdown(anchorBtn);
        langDropdownPopover.classList.add('is-open');
        requestAnimationFrame(() => langSearchInput.focus({ preventScroll: true }));
      }

      function closeLangDropdown() {
        state.activePickerType = null;
        langDropdownPopover.classList.remove('is-open');
      }

      sourceLangBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openLangDropdown('source', sourceLangBtn);
      });

      targetLangBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openLangDropdown('target', targetLangBtn);
      });

      langSearchInput.addEventListener('input', () => {
        renderLangOptions(langSearchInput.value);
      });

      langSearchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const firstOption = langOptionsList.querySelector('.lang-option-item');
          if (firstOption) firstOption.click();
        } else if (e.key === 'Escape') {
          e.stopPropagation();
          closeLangDropdown();
        }
      });

      function cycleLang(type, delta) {
        const pool = type === 'source'
          ? LANGUAGES
          : LANGUAGES.filter((l) => !l.allowSourceOnly);
        const currentCode = type === 'source' ? state.sourceLang : state.targetLang;
        const idx = Math.max(0, pool.findIndex((l) => l.code === currentCode));
        const nextIdx = (idx + delta + pool.length) % pool.length;
        if (type === 'source') {
          state.sourceLang = pool[nextIdx].code;
        } else {
          state.targetLang = pool[nextIdx].code;
        }
        syncLangLabels();
        if (translateInput.value.trim()) queueTranslate(0);
      }

      prevSourceLangBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleLang('source', -1); });
      nextSourceLangBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleLang('source', 1); });
      prevTargetLangBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleLang('target', -1); });
      nextTargetLangBtn.addEventListener('click', (e) => { e.stopPropagation(); cycleLang('target', 1); });

      // --- ĐỔI TIỀN TỆ NHANH KẾT THÚC BẰNG '=' ---
      function normalizeNumber(tok) {
        if (tok.includes('.') && tok.includes(',')) {
          return tok.lastIndexOf(',') > tok.lastIndexOf('.')
            ? tok.replace(/\./g, '').replace(',', '.')
            : tok.replace(/,/g, '');
        }
        if (tok.includes('.')) {
          return /^\d{1,3}(\.\d{3})+$/.test(tok) ? tok.replace(/\./g, '') : tok;
        }
        if (tok.includes(',')) {
          return /^\d{1,3}(,\d{3})+$/.test(tok) ? tok.replace(/,/g, '') : tok.replace(',', '.');
        }
        return tok;
      }

      function evaluateCurrency(rawExpr) {
        const m = rawExpr
          .trim()
          .match(/^([\d.,]+)\s*([a-zA-Z]{3})\s*(?:to|in|->|=|sang)\s*([a-zA-Z]{3})$/i);
        if (!m) return null;

        const amt = Number(normalizeNumber(m[1]));
        const from = m[2].toUpperCase();
        const to = m[3].toUpperCase();

        if (!Number.isFinite(amt) || !FX_TO_USD[from] || !FX_TO_USD[to]) return null;

        const usdVal = amt / FX_TO_USD[from];
        const converted = usdVal * FX_TO_USD[to];
        const rounded = Math.round(converted * 100) / 100;
        const formatted = rounded.toLocaleString('de-DE', {
          minimumFractionDigits: to === 'IDR' || to === 'VND' || to === 'JPY' || to === 'KRW' ? 0 : 2,
          maximumFractionDigits: 2
        });

        const prefix = to === 'IDR' ? 'Rp' : to === 'VND' ? '₫' : to === 'USD' ? '$' : '';
        const inline = prefix ? `${prefix}${formatted}` : `${formatted} ${to}`;
        const detail =
          `Quy đổi tiền tệ: ${m[1]} ${from} → ${inline}\n` +
          `• Tỷ giá tham chiếu nhanh (1 USD ≈ ${FX_TO_USD[to].toLocaleString('de-DE')} ${to})`;

        return {
          inline,
          raw: formatted,
          compactDetail: detail,
          fullDigits: `${inline} (${rounded})`,
          isLong: false
        };
      }

      // --- TOÁN BIGINT SỐ LỚN TỨC THÌ ---
      function rangeProductBigInt(arr, l, r) {
        if (l === r) return arr[l];
        if (l + 1 === r) return arr[l] * arr[r];
        const m = (l + r) >> 1;
        return rangeProductBigInt(arr, l, m) * rangeProductBigInt(arr, m + 1, r);
      }

      function bigFactorial(n) {
        if (n < 0) return { error: 'Giai thừa không áp dụng cho số âm.' };
        if (n > MAX_FACTORIAL) {
          return { error: `Giai thừa ${n.toLocaleString()}! vượt ngưỡng an toàn (${MAX_FACTORIAL.toLocaleString()}!).` };
        }
        if (n <= 1) return { value: 1n, isBigInt: true };
        const nums = [];
        for (let i = 2; i <= n; i++) nums.push(BigInt(i));
        return { value: rangeProductBigInt(nums, 0, nums.length - 1), isBigInt: true };
      }

      function bigPow(base, exp) {
        if (exp < 0n) return { error: 'Số mũ âm không dùng BigInt nguyên.' };
        if (exp > BigInt(MAX_EXPONENT)) {
          return { error: `Số mũ ${exp.toString()} vượt ngưỡng an toàn (${MAX_EXPONENT.toLocaleString()}) để tránh treo tab.` };
        }
        let res = 1n;
        let b = base;
        let e = exp;
        while (e > 0n) {
          if (e & 1n) res *= b;
          e >>= 1n;
          if (e > 0n) b *= b;
        }
        return { value: res, isBigInt: true };
      }

      function evaluateBigInt(expr) {
        let work = expr.replace(/\s+/g, '');

        const factRe = /(\d+)!/g;
        let m;
        while ((m = factRe.exec(work)) !== null) {
          const n = Number(m[1]);
          if (!Number.isSafeInteger(n)) return { error: `Số giai thừa quá lớn: ${m[1]}!` };
          const fr = bigFactorial(n);
          if (fr.error) return { error: fr.error };
          work = work.slice(0, m.index) + fr.value.toString() + work.slice(m.index + m[0].length);
          factRe.lastIndex = 0;
        }

        const powRe = /(\d+)\^(\d+)(?!\^)/;
        while (work.includes('^')) {
          const pm = powRe.exec(work);
          if (!pm) return { error: 'Lũy thừa lồng nhau phức tạp — bấm "Hỏi AI giải" để xử lý.' };
          const pr = bigPow(BigInt(pm[1]), BigInt(pm[2]));
          if (pr.error) return { error: pr.error };
          work = work.slice(0, pm.index) + pr.value.toString() + work.slice(pm.index + pm[0].length);
        }

        const bigCode = work.replace(/(?<![0-9.])(\d+)(?![0-9.])/g, '$1n');
        if (!/^[0-9n+\-*()\s]+$/.test(bigCode)) return null;
        const val = Function('"use strict"; return (' + bigCode + ')')();
        return typeof val === 'bigint' ? { value: val, isBigInt: true } : null;
      }

      function calculateMath(raw) {
        let expr = raw.trim().replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        if (!expr) return null;

        expr = expr.replace(/\d[\d.,]*/g, (tok) => normalizeNumber(tok));
        expr = expr.replace(/(\d+(?:\.\d+)?)\s*([+\-])\s*(\d+(?:\.\d+)?)%/g, (_, a, op, p) => `${a} ${op} (${a} * ${p} / 100)`);
        expr = expr.replace(/(\d+(?:\.\d+)?)%/g, '($1 / 100)');

        let depth = 0;
        for (const ch of expr) {
          if (ch === '(') depth++;
          if (ch === ')') depth--;
          if (depth < 0) return null;
        }
        if (depth !== 0) return null;

        const isBigCandidate =
          /^[0-9+\-*^!\s()]+$/.test(expr) &&
          !expr.includes('/') &&
          (/(\^|!)/.test(expr) || /\d{14,}/.test(expr));

        if (isBigCandidate) {
          const b = evaluateBigInt(expr);
          if (b && b.error) return b;
          if (b && typeof b.value === 'bigint') return b;
        }

        const jsExpr = expr.replace(/\^/g, '**');
        if (!/^[0-9+\-*/().**\s]+$/.test(jsExpr)) return null;
        const num = Function('"use strict"; return (' + jsExpr + ')')();
        if (typeof num !== 'number' || !isFinite(num)) {
          if (num === Infinity || num === -Infinity) {
            return { error: 'Vượt giới hạn số thực (Infinity) — dùng số nguyên BigInt hoặc bấm "Hỏi AI giải".' };
          }
          return null;
        }
        return { value: num, isBigInt: false };
      }

      function formatMathResult(res) {
        if (res.isBigInt) {
          const raw = res.value.toString();
          const neg = raw.startsWith('-');
          const digits = neg ? raw.slice(1) : raw;
          const len = digits.length;

          if (len > 22) {
            const head = digits.slice(0, 7);
            const exp = len - 1;
            const sign = neg ? '-' : '';
            const shortStr = `${sign}${head[0]}.${head.slice(1)}...e+${exp} · ${len.toLocaleString()} digits`;
            const compactDetail =
              `Kết quả BigInt (${len.toLocaleString()} chữ số):\n` +
              `• Tóm tắt: ${shortStr}\n` +
              `• 64 chữ số đầu: ${sign}${digits.slice(0, 64)}...\n` +
              `• 64 chữ số cuối: ...${digits.slice(-64)}`;
            return {
              inline: shortStr,
              raw,
              compactDetail,
              fullDigits: `${sign}${digits}`,
              isLong: true
            };
          }

          const grouped = digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
          const pretty = `${neg ? '-' : ''}${grouped}`;
          return {
            inline: pretty,
            raw,
            compactDetail: `Kết quả: ${pretty}`,
            fullDigits: pretty,
            isLong: false
          };
        }

        const n = res.value;
        if (Math.abs(n) >= 1e15) {
          const len = Math.floor(Math.log10(Math.abs(n))) + 1;
          const s = `${n.toExponential(2)} · ${len.toLocaleString()} digits`;
          return {
            inline: s,
            raw: n.toString(),
            compactDetail: `Giá trị: ${n.toString()}`,
            fullDigits: n.toString(),
            isLong: true
          };
        }

        const rounded = Math.round(n * 1e8) / 1e8;
        const parts = rounded.toString().split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        const pretty = parts.length > 1 ? `${parts[0]},${parts[1]}` : parts[0];
        return {
          inline: pretty,
          raw: rounded.toString(),
          compactDetail: `Kết quả: ${pretty}`,
          fullDigits: pretty,
          isLong: false
        };
      }

      function checkLiveMath(val) {
        const trimmed = val.trim();
        if (!trimmed.endsWith('=')) {
          inlineMathGroup.classList.add('hidden');
          inlineMathGroup.classList.remove('flex');
          state.mathRaw = '';
          state.mathFullText = '';
          state.mathCompactText = '';
          refreshSpringTargets();
          return false;
        }

        const expr = trimmed.slice(0, -1).trim();
        if (!expr) return false;

        try {
          const fx = evaluateCurrency(expr);
          if (fx) {
            inlineMathValue.textContent = fx.inline;
            state.mathRaw = fx.raw;
            state.mathFullText = fx.fullDigits;
            state.mathCompactText = fx.compactDetail;
            inlineMathGroup.classList.remove('hidden');
            inlineMathGroup.classList.add('flex');
            refreshSpringTargets();
            return true;
          }

          const calc = calculateMath(expr);
          if (calc && calc.error) {
            inlineMathValue.textContent = 'Limit';
            state.mathRaw = calc.error;
            state.mathFullText = calc.error;
            state.mathCompactText = calc.error;
            inlineMathGroup.classList.remove('hidden');
            inlineMathGroup.classList.add('flex');
            refreshSpringTargets();
            return true;
          }
          if (calc) {
            const fmt = formatMathResult(calc);
            inlineMathValue.textContent = fmt.inline;
            state.mathRaw = fmt.raw;
            state.mathFullText = fmt.fullDigits;
            state.mathCompactText = fmt.compactDetail;
            inlineMathGroup.classList.remove('hidden');
            inlineMathGroup.classList.add('flex');
            refreshSpringTargets();
            return true;
          }
        } catch (_) {
          return false;
        }

        inlineMathGroup.classList.add('hidden');
        inlineMathGroup.classList.remove('flex');
        state.mathRaw = '';
        state.mathFullText = '';
        state.mathCompactText = '';
        refreshSpringTargets();
        return false;
      }

      function syncLongAskInputScroll() {
        const isOverflowing = askInput.scrollWidth > askInput.clientWidth + 1;
        if (isOverflowing) {
          askInput.scrollLeft = Math.max(0, askInput.scrollWidth - askInput.clientWidth);
        }
      }

      askInput.addEventListener(
        'wheel',
        (e) => {
          const maxScroll = askInput.scrollWidth - askInput.clientWidth;
          if (maxScroll <= 0) return;

          const rawDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
          if (rawDelta === 0) return;

          const multiplier = e.deltaMode === 1 ? 28 : e.deltaMode === 2 ? askInput.clientWidth : 1;
          const nextScroll = Math.max(0, Math.min(maxScroll, askInput.scrollLeft + rawDelta * multiplier));

          if (nextScroll !== askInput.scrollLeft) {
            e.preventDefault();
            askInput.scrollLeft = nextScroll;
          }
        },
        { passive: false }
      );

      let isDraggingAskScroll = false;
      let hasMovedAskDrag = false;
      let dragStartX = 0;
      let dragStartScrollLeft = 0;

      askInput.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || askInput.scrollWidth <= askInput.clientWidth) return;
        isDraggingAskScroll = true;
        hasMovedAskDrag = false;
        dragStartX = e.clientX;
        dragStartScrollLeft = askInput.scrollLeft;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDraggingAskScroll) return;
        const dx = e.clientX - dragStartX;
        if (Math.abs(dx) > 3) {
          hasMovedAskDrag = true;
        }
        if (hasMovedAskDrag) {
          askInput.scrollLeft = Math.max(
            0,
            Math.min(askInput.scrollWidth - askInput.clientWidth, dragStartScrollLeft - dx)
          );
        }
      });

      window.addEventListener('mouseup', () => {

      async function performLiveTranslate() {
        const text = translateInput.value.trim();
        charCounter.textContent = `${translateInput.value.length}/800`;
        clearTranslateBtn.classList.toggle('hidden', translateInput.value.length === 0);

        if (!text) {
          detectedLangBadge.textContent = '';
          translateOutput.innerHTML = '<span class="text-white/30">Translation</span>';
          translateFooterNote.textContent = 'Enter to translate · Shift+Enter new line · Esc close';
          setThinking(false);
          return;
        }

        if (state.translateAbort) state.translateAbort.abort();
        state.translateAbort = new AbortController();

        const sl = state.sourceLang;
        const tl = state.targetLang;
        const t0 = performance.now();

        setThinking(true);
        translateFooterNote.textContent = 'Translating...';

        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(text)}`;
          const res = await fetch(url, { signal: state.translateAbort.signal });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const translated = (Array.isArray(data?.[0]) ? data[0] : [])
            .map((seg) => seg?.[0] || '')
            .join('')
            .trim();
          const detectedCode = typeof data?.[2] === 'string' ? data[2] : '';
          const ms = Math.round(performance.now() - t0);

          setThinking(false);
          if (sl === 'auto' && detectedCode && LANG_NAME_MAP[detectedCode]) {
            detectedLangBadge.textContent = `Detected: ${LANG_NAME_MAP[detectedCode]}`;
          } else {
            detectedLangBadge.textContent = '';
          }
          translateOutput.textContent = translated || text;
          translateFooterNote.textContent = `Google Translate · ${ms}ms · Esc close`;
        } catch (err) {
          if (err.name === 'AbortError') return;
          setThinking(false);
          detectedLangBadge.textContent = '';
          translateOutput.textContent = text;
          translateFooterNote.textContent = 'Offline / Network error';
        }
      }

        }

      function attachmentMeta(id, file) {
        const extension = (file.name || '').toLowerCase().split('.').pop();
        const known = {png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', gif: 'image/gif', pdf: 'application/pdf', mp4: 'video/mp4', webm: 'video/webm', mov: 'video/quicktime', mp3: 'audio/mpeg', wav: 'audio/wav', m4a: 'audio/mp4'};
        return { id, name: file.name || 'attachment', type: file.type || known[extension] || 'application/octet-stream', size: file.size };
      }

      function fileDb() {
        if (!window.indexedDB) return Promise.resolve(null);
        if (!fileDatabase) fileDatabase = new Promise((resolve, reject) => {
          const request = window.indexedDB.open('nusa-attachments-v1', 1);
          request.onupgradeneeded = () => request.result.createObjectStore('files');
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
          request.onblocked = () => reject(new Error('File storage is blocked'));
        }).catch(() => null);
        return fileDatabase;
      }

      async function storeFile(file) {
        const id = crypto.randomUUID();
        fileMemory.set(id, file);
        const db = await fileDb();
        if (db) {
          try {
            await new Promise((resolve, reject) => {
              const transaction = db.transaction('files', 'readwrite');
              transaction.objectStore('files').put(file, id);
              transaction.oncomplete = resolve;
              transaction.onerror = () => reject(transaction.error);
              transaction.onabort = () => reject(transaction.error);
            });
          } catch (_) { attachmentNotice('Không lưu được file trên máy. File vẫn dùng được trong lần mở này.'); }
        } else attachmentNotice('Trình duyệt không lưu được file lâu dài. File chỉ còn trong lần mở này.');
        return attachmentMeta(id, file);
      }

      async function localFile(id) {
        if (fileMemory.has(id)) return fileMemory.get(id);
        const db = await fileDb();
        if (!db) return null;
        return new Promise((resolve) => {
          const request = db.transaction('files').objectStore('files').get(id);
          request.onsuccess = () => {
            if (request.result) fileMemory.set(id, request.result);
            resolve(request.result || null);
          };
          request.onerror = () => resolve(null);
        });
      }

      function attachmentNotice(text) {
        attachmentStatus.textContent = text;
        attachmentStatus.classList.toggle('hidden', !text);
      }

      async function fileUrl(meta) {
        if (fileUrls.has(meta.id)) return fileUrls.get(meta.id);
        const file = await localFile(meta.id);
        if (!file) return null;
        const url = URL.createObjectURL(file);
        fileUrls.set(meta.id, url);
        return url;
      }

          download.className = 'attachment-name';
          download.textContent = meta.name + ' · ' + (meta.size >= 1048576 ? (meta.size / 1048576).toFixed(1) + ' MB' : Math.ceil(meta.size / 1024) + ' KB');
          download.title = 'Tải xuống ' + meta.name;
          download.addEventListener('click', async () => {
            const url = await fileUrl(meta);
            if (!url) { attachmentNotice('File không còn trên máy. Hãy kéo file vào lại.'); return; }
            const link = document.createElement('a');

          if (visual) {

            preview.addEventListener('click', () => { void openMediaViewer(meta); });
            const media = document.createElement(kind === 'video' ? 'video' : 'img');
            media.className = 'attachment-preview';
            if (kind === 'video') {
              media.muted = true; media.playsInline = true; media.preload = 'metadata';
              media.addEventListener('loadedmetadata', () => { try { media.currentTime = Math.min(0.1, media.duration || 0); } catch (_) {} });
            } else { media.alt = meta.name; media.loading = 'lazy'; media.decoding = 'async'; }
            preview.appendChild(media);
            void fileUrl(meta).then((url) => { if (url) media.src = url; });
            card.appendChild(preview);
            const label = document.createElement('span'); label.className = 'attachment-media-name'; label.textContent = meta.name; card.appendChild(label);
            if (kind === 'video') { const play = document.createElement('span'); play.className = 'attachment-play'; play.textContent = '▶'; play.setAttribute('aria-hidden', 'true'); card.appendChild(play); }
            download.className = 'attachment-download'; download.textContent = '↓'; download.setAttribute('aria-label', 'Tải xuống ' + meta.name);
          } else {
            card.classList.add('attachment-file');
            download.className = 'attachment-file-open'; download.textContent = '';
            download.setAttribute('aria-label', 'Tải xuống ' + meta.name);
            const icon = document.createElement('span'); icon.className = 'attachment-file-icon';
            const fileIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3V9z"/><path d="M14 2v5a2 2 0 0 0 2 2h5"/></svg>';
            icon.innerHTML = fileIcon;

            typeIcon.innerHTML = /\.html?$/i.test(meta.name) ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></svg>' : fileIcon;
            const label = document.createElement('span'); label.className = 'attachment-file-label'; label.textContent = meta.name;
            footer.appendChild(typeIcon); footer.appendChild(label);
            download.appendChild(icon); download.appendChild(footer);
          }
          card.appendChild(download);
          const supported = state.provider === 'openai' ? ['image', 'text', 'pdf', 'office'].includes(kind) : ['image', 'video', 'audio', 'text', 'pdf'].includes(kind);
          if (!supported) {

      async function addAttachments(files) {
        attachmentNotice('');

      async function discardUnusedFiles(attachments) {
        const used = new Set([
          ...state.draftAttachments,
          ...state.chatHistory.flatMap((chat) => chat.messages.flatMap((message) => message.attachments || [])),
          ...(state.deletedChat?.messages.flatMap((message) => message.attachments || []) || [])
        ].map((item) => item.id));
        const db = await fileDb();
        for (const meta of attachments || []) {
          if (used.has(meta.id)) continue;
          fileMemory.delete(meta.id);
          if (fileUrls.has(meta.id)) URL.revokeObjectURL(fileUrls.get(meta.id));
          fileUrls.delete(meta.id);
          if (db) {
            try { db.transaction('files', 'readwrite').objectStore('files').delete(meta.id); } catch (_) {}
          }

      function fileKind(meta) {
        const extension = meta.name.toLowerCase().split('.').pop();
        if (extension === 'svg') return 'text';
        if (meta.type.startsWith('image/')) return 'image';
        if (meta.type.startsWith('video/') || ['mp4', 'mov', 'webm', 'avi', 'mkv', 'mpeg', 'mpg'].includes(extension)) return 'video';
        if (meta.type.startsWith('audio/') || ['mp3', 'wav', 'm4a', 'ogg', 'flac'].includes(extension)) return 'audio';
        if (meta.type.startsWith('text/') || ['txt', 'md', 'json', 'csv', 'tsv', 'js', 'ts', 'jsx', 'tsx', 'py', 'html', 'css', 'xml', 'yaml', 'yml', 'sql', 'c', 'cpp', 'h', 'java', 'rs', 'go', 'sh', 'ps1', 'log', 'svg'].includes(extension)) return 'text';
        if (extension === 'pdf' || meta.type === 'application/pdf') return 'pdf';
        if (['doc', 'docx', 'rtf', 'odt', 'ppt', 'pptx', 'xls', 'xlsx'].includes(extension)) return 'office';
        return 'binary';
      }

      async function uploadAttachment(meta, provider, key, signal, onProgress = () => {}) {
        const progress = (label, status = 'running') => onProgress(label, {id: 'file-' + meta.id, kind: 'file', detail: meta.name, status});
        const cacheKey = provider + ':' + key + ':' + meta.id;
        const cached = remoteFiles.get(cacheKey);
        if (cached && cached.expires > Date.now()) { progress('Dùng lại tệp đã tải lên', 'complete'); return cached; }
        progress('Đang đọc tệp trên máy');
        const file = await localFile(meta.id);
        if (!file) throw new Error('File không còn trên máy: ' + meta.name + '. Hãy đính kèm lại.');
        progress('Đang tải tệp lên ' + (provider === 'openai' ? 'OpenAI' : 'Gemini'));
        let result;
        if (provider === 'openai') {
          if (file.size >= 50 * 1024 * 1024) throw new Error('OpenAI yêu cầu file nhỏ hơn 50 MB: ' + meta.name);
          const body = new FormData(); body.append('purpose', 'user_data'); body.append('file', file, meta.name);
          const data = await responseJson(await fetch('https://api.openai.com/v1/files', {method: 'POST', headers: {Authorization: 'Bearer ' + key}, body, signal}));
          result = {id: data.id, expires: Date.now() + 24 * 60 * 60 * 1000};
        } else {
          if (file.size >= 2 * 1024 * 1024 * 1024) throw new Error('Gemini yêu cầu file nhỏ hơn 2 GB: ' + meta.name);
          const mime = fileKind(meta) === 'text' ? 'text/plain' : meta.type === 'application/octet-stream' && /\.pdf$/i.test(meta.name) ? 'application/pdf' : meta.type;
          const start = await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files', {
            method: 'POST', signal,
            headers: {'x-goog-api-key': key, 'Content-Type': 'application/json', 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start', 'X-Goog-Upload-Header-Content-Length': String(file.size), 'X-Goog-Upload-Header-Content-Type': mime},
            body: JSON.stringify({file: {display_name: meta.name}})
          });
          if (!start.ok) await responseJson(start);
          const uploadUrl = start.headers.get('x-goog-upload-url');
          if (!uploadUrl || !uploadUrl.startsWith('https://generativelanguage.googleapis.com/')) throw new Error('Gemini không trả về địa chỉ upload hợp lệ.');
          let data = await responseJson(await fetch(uploadUrl, {method: 'POST', headers: {'X-Goog-Upload-Offset': '0', 'X-Goog-Upload-Command': 'upload, finalize'}, body: file, signal}));
          let remote = data.file;
          const deadline = Date.now() + 120000;
          while (remote?.state === 'PROCESSING') {
            progress('API đang xử lý tệp vừa tải lên');
            if (Date.now() > deadline) throw new Error('Gemini xử lý file quá lâu: ' + meta.name);
            await abortableDelay(1000, signal);
            remote = await responseJson(await fetch('https://generativelanguage.googleapis.com/v1beta/' + remote.name, {headers: {'x-goog-api-key': key}, signal}));
          }
          if (!remote?.uri || remote.state === 'FAILED') throw new Error('Gemini không xử lý được file: ' + meta.name);
          result = {uri: remote.uri, mime: remote.mimeType || mime, expires: Date.now() + 47 * 60 * 60 * 1000};
        }
        remoteFiles.set(cacheKey, result);
        progress('Tệp đã sẵn sàng cho AI', 'complete');
        return result;
      }

      function abortableDelay(ms, signal) {
        return new Promise((resolve, reject) => {
          if (signal?.aborted) { reject(new DOMException('Aborted', 'AbortError')); return; }
          const abort = () => { clearTimeout(timer); reject(new DOMException('Aborted', 'AbortError')); };
          const timer = setTimeout(() => { signal?.removeEventListener('abort', abort); resolve(); }, ms);
          signal?.addEventListener('abort', abort, {once: true});
        });
      }

      async function providerMessages(messages, provider, key, signal, onProgress = () => {}) {
        const output = [];
        let openaiBytes = 0;
        for (const message of messages) {
          if (message.role === 'assistant' && message.errorText && !message.text && !message.attachments?.length) continue;
          const text = message.text + (message.role === 'assistant' && message.attachments?.length ? '\nFiles delivered: ' + message.attachments.map((file) => file.name).join(', ') : '');
          if (message.role === 'assistant') { output.push(provider === 'openai' ? {role: 'assistant', content: text} : {role: 'model', parts: [{text}]}); continue; }
          const parts = provider === 'openai' ? [{type: 'input_text', text}] : [{text}];
          for (const meta of message.attachments || []) {
            const kind = fileKind(meta);
            const supported = provider === 'openai' ? ['image', 'text', 'pdf', 'office'].includes(kind) : ['image', 'video', 'audio', 'text', 'pdf'].includes(kind);
            if (!supported) {
              const note = '[Đính kèm ' + meta.name + ': loại file này được lưu để tải xuống, nhưng API ' + provider + ' đang chọn không phân tích trực tiếp được. Không suy đoán nội dung file.]';
              onProgress('Bỏ qua tệp API không hỗ trợ', {id: 'file-' + meta.id, kind: 'file', detail: meta.name, status: 'skipped'});
              parts.push(provider === 'openai' ? {type: 'input_text', text: note} : {text: note});
              continue;
            }
            if (provider === 'openai') {
              openaiBytes += meta.size;
              if (openaiBytes >= 50 * 1024 * 1024) throw new Error('Tổng file trong ngữ cảnh OpenAI phải nhỏ hơn 50 MB.');
            }
            const uploaded = await uploadAttachment(meta, provider, key, signal, onProgress);
            parts.push(provider === 'openai' ? kind === 'image' ? {type: 'input_image', file_id: uploaded.id} : {type: 'input_file', file_id: uploaded.id} : {fileData: {mimeType: uploaded.mime, fileUri: uploaded.uri}});
          }
          output.push(provider === 'openai' ? {role: 'user', content: parts} : {role: 'user', parts});
        }
        return output;
      }

      async function readEventStream(response, provider, onText) {
        const calls = new Map();
        let complete = false;
        let text = '';
        const emit = (value) => { if (typeof value === 'string' && value) { text += value; onText(value); } };
        const accept = (data) => {
          if (data.error || data.type === 'error' || data.type === 'response.failed') throw new Error(data.error?.message || data.response?.error?.message || data.message || 'API streaming lỗi.');
          if (provider === 'gemini') {
            for (const part of data.candidates?.[0]?.content?.parts || []) {
              if (part.text && !part.thought) emit(part.text);
              if (part.functionCall) {
                const call = part.functionCall;
                calls.set(call.id || call.name + JSON.stringify(call.args), {id: call.id, name: call.name, args: call.args || {}, geminiPart: part});
              }
            }
            if (data.candidates?.[0]?.finishReason) complete = true;
            if (data.promptFeedback?.blockReason) throw new Error('Yêu cầu bị chặn: ' + data.promptFeedback.blockReason);
          } else {
            if (data.type === 'response.output_text.delta' || data.type === 'response.refusal.delta') emit(data.delta);
            if (data.type === 'response.output_item.added' && data.item?.type === 'function_call') calls.set(data.item.id, {...data.item});
            if (data.type === 'response.function_call_arguments.delta') {
              const call = calls.get(data.item_id);
              if (call) call.arguments = (call.arguments || '') + data.delta;
            }
            if (data.type === 'response.output_item.done' && data.item?.type === 'function_call') calls.set(data.item.id, {...data.item});
            if (data.type === 'response.completed') {
              complete = true;
              for (const item of data.response?.output || []) if (item.type === 'function_call') calls.set(item.id, {...item});
              if (!text) emit(data.response?.output_text);
            }
            if (data.type === 'response.incomplete') throw new Error('Câu trả lời bị ngắt: ' + (data.response?.incomplete_details?.reason || 'chưa hoàn thành'));
          }
        };
        if (!response.ok) await responseJson(response);
        if (!response.body?.getReader || !(response.headers?.get('content-type') || '').includes('text/event-stream')) {
          const data = await responseJson(response);
          if (provider === 'gemini') accept(data);
          else {
            emit(data.output_text || data.output?.filter((item) => item.type === 'message').flatMap((item) => item.content || []).map((part) => part.text || '').join('') || data.choices?.[0]?.message?.content || '');
            for (const item of data.output || []) if (item.type === 'function_call') calls.set(item.id, item);
          }
          complete = true;
        } else {
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';
          let eventLines = [];
          const dispatch = () => {
            const payload = eventLines.filter((line) => line.startsWith('data:')).map((line) => line.slice(5).replace(/^ /, '')).join('\n');
            eventLines = [];
            if (!payload) return;
            if (payload === '[DONE]') { complete = true; return; }
            accept(JSON.parse(payload));
          };
          try {
            while (true) {
              const {value, done} = await reader.read();
              buffer += done ? decoder.decode() : decoder.decode(value, {stream: true});
              let newline;
              while ((newline = buffer.indexOf('\n')) !== -1) {
                const line = buffer.slice(0, newline).replace(/\r$/, '');
                buffer = buffer.slice(newline + 1);
                if (!line) dispatch(); else eventLines.push(line);
              }
              if (done) break;
            }
            if (buffer.trim()) eventLines.push(buffer.replace(/\r$/, ''));
            if (eventLines.length) dispatch();
          } finally {
            try { await reader.cancel(); } catch (_) {}
            reader.releaseLock();
          }
          if (!complete) throw new Error('Kết nối bị ngắt trước khi AI trả lời xong.');
        }
        return {text, calls: Array.from(calls.values()).map((call) => ({...call, args: call.args || JSON.parse(call.arguments || '{}')}))};
      }

        const formatting = ' Chủ động quyết định có thực sự cần một khung để sao chép hoặc tải riêng hay không. Mặc định trả lời bằng văn bản bình thường, không fenced block. Chỉ đóng khung một sản phẩm độc lập mà người dùng cần dùng lại nguyên văn, như mã nguồn, cấu hình, prompt hoàn chỉnh hoặc mẫu nội dung họ yêu cầu soạn. Không đóng khung toàn bộ câu trả lời; không đóng khung lời chào, hỏi đáp, tư vấn, danh sách hay phần giải thích chỉ vì chúng là văn bản. Khi thật sự cần khung, văn bản dùng ngôn ngữ text và mã nguồn ghi đúng ngôn ngữ; khung chỉ chứa phần dùng trực tiếp, lời giới thiệu và giải thích để bên ngoài. Không tạo file bằng công cụ chỉ để trình bày câu trả lời thông thường.';
        const lastUserIndex = messages.findLastIndex((message) => message.role === 'user' && !message.internal);
        const prompt = historySearchKey(messages[lastUserIndex]?.text || '');
        const imageRequested = /^(?:(?:hay|vui long|lam on|ban|giup|please|can you)\s+)*(?:(?:tao|ve)(?:\s+cho\s+(?:toi|tao|minh))?\s+(?:(?:mot|1|hai|ba|bon|2|3|4|buc|tam|cai)\s+)*(?:anh|hinh)|ve\s+(?:con|mot|canh)|(?:create|generate|draw)\b.*\b(?:image|picture|photo|illustration)\b)/.test(prompt)
          && !messages.slice(lastUserIndex + 1).some((message) => message.attachments?.some((file) => fileKind(file) === 'image'));
        let answer = '';
        for (let round = 0; round < 4; round++) {
          if (signal.aborted) throw new DOMException('Aborted', 'AbortError');
          const apiStep = {id: 'api-' + round, kind: 'api', detail: model};
          onProgress('Đang chờ ' + (provider === 'openai' ? 'OpenAI' : 'Gemini') + ' trả lời', apiStep);
          const response = provider === 'openai' ? await fetch('https://api.openai.com/v1/responses', {
            method: 'POST', signal, headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + key},
            body: JSON.stringify({model, stream: true, instructions: instruction + formatting, input,
              ...(round === 0 && imageRequested ? {tool_choice: {type: 'function', name: 'create_image'}} : {}),
              tools: round < 3 ? deliveryFunctions.map((tool) => ({type: 'function', ...tool, parameters: {...tool.parameters, additionalProperties: false}, strict: true})) : []})
          }) : await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse', {
            method: 'POST', signal, headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
            body: JSON.stringify({systemInstruction: {parts: [{text: instruction + formatting}]}, contents: input,
              ...(round === 0 && imageRequested ? {toolConfig: {functionCallingConfig: {mode: 'ANY', allowedFunctionNames: ['create_image']}}} : {}),
              tools: round < 3 ? [{functionDeclarations: deliveryFunctions}] : []})

          let receivedText = false;
          const result = await readEventStream(response, provider, (delta) => {
            if (!receivedText) { receivedText = true; onProgress('Đang nhận nội dung trả lời'); }

          onProgress('Đã nhận phản hồi từ ' + (provider === 'openai' ? 'OpenAI' : 'Gemini'), {...apiStep, status: 'complete'});
          if (!result.calls.length) return answer;
          if (round === 3) throw new Error('AI gọi công cụ quá nhiều lần. Hãy chia yêu cầu thành bước nhỏ hơn.');
          if (provider === 'gemini') input.push({
            role: 'model',
            parts: result.calls.map((call) => call.geminiPart || {
              functionCall: {name: call.name, args: call.args, ...(call.id ? {id: call.id} : {})}
            })
          });
          const geminiResponses = [];
          for (const call of result.calls) {
            let output;
            const toolStep = {id: 'tool-' + round + '-' + (call.call_id || call.id || geminiResponses.length), kind: 'tool', detail: call.name + (call.args?.filename ? ' · ' + call.args.filename : '')};
            try {

            } catch (err) {

      const scrollToLatestBtn = document.getElementById('scrollToLatestBtn');
      function syncScrollToLatest() {
        const awayFromBottom = answerStreamBox.scrollHeight - answerStreamBox.scrollTop - answerStreamBox.clientHeight > 48;
        scrollToLatestBtn.classList.toggle('hidden', !awayFromBottom);
      }
      scrollToLatestBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if (state.activeAi?.view) state.activeAi.view.followBottom = true;
        answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
        syncScrollToLatest();
      });
      answerStreamBox.addEventListener('scroll', () => {
        const view = state.activeAi?.view;
        if (view) view.followBottom = answerStreamBox.scrollHeight - answerStreamBox.scrollTop - answerStreamBox.clientHeight < 48;
        syncScrollToLatest();
      }, {passive: true});
      if (typeof ResizeObserver !== 'undefined') new ResizeObserver(syncScrollToLatest).observe(answerStreamBox);
      if (typeof MutationObserver !== 'undefined') new MutationObserver(syncScrollToLatest).observe(answerStreamBox, {childList: true});

      function normalizeAnswerActivity(activity) {
        if (!activity || !Number.isFinite(activity.elapsedMs) || activity.elapsedMs < 0 || !['complete', 'stopped', 'error'].includes(activity.status) || !Array.isArray(activity.steps)) return null;
        return {elapsedMs: activity.elapsedMs, status: activity.status, steps: activity.steps.slice(0, 40).filter((step) => step && typeof step.label === 'string' && Number.isFinite(step.atMs) && step.atMs >= 0).map((step) => ({label: step.label.slice(0, 160), atMs: step.atMs,
          kind: ['api', 'file', 'tool'].includes(step.kind) ? step.kind : 'status',
          status: ['running', 'complete', 'error', 'stopped', 'skipped'].includes(step.status) ? step.status : 'complete',
          ...(typeof step.id === 'string' ? {id: step.id.slice(0, 120)} : {}),
          ...(typeof step.detail === 'string' ? {detail: step.detail.slice(0, 240)} : {}),
          ...(Number.isFinite(step.endMs) && step.endMs >= step.atMs ? {endMs: step.endMs} : {})}))};
      }

      function activityTime(ms) {
        const seconds = Math.floor(ms / 1000);
        return seconds >= 60 ? Math.floor(seconds / 60) + 'm ' + seconds % 60 + 's' : seconds + 's';
      }

      function createAnswerActivity(metadata = null, live = true) {
        const data = normalizeAnswerActivity(metadata) || {elapsedMs: 0, status: 'running', steps: []};
        if (live) data.status = 'running';
        const started = Date.now() - data.elapsedMs;
        const details = document.createElement('details'); details.className = 'answer-activity';
        const summary = document.createElement('summary');
        const label = document.createElement('span'); summary.appendChild(label);
        const arrow = document.createElement('span'); arrow.className = 'activity-chevron';
        arrow.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
        summary.appendChild(arrow); details.appendChild(summary);
        const list = document.createElement('ol'); list.tabIndex = 0; list.setAttribute('aria-label', 'Các bước xử lý'); details.appendChild(list);
        details.addEventListener('wheel', (event) => {
          if (!details.open || !event.deltaY) return;
          if (state.activeAi?.view) state.activeAi.view.followBottom = false;
        }, {passive: true});
        const rows = [];
        const paintRow = (step, index) => {
          let row = rows[index];
          if (!row) {
            row = document.createElement('li');
            const marker = document.createElement('span'); marker.className = 'activity-marker';
            const content = document.createElement('div'); content.className = 'activity-content';
            const title = document.createElement('div'); title.className = 'activity-row-title';
            const name = document.createElement('span'); const time = document.createElement('time');
            title.appendChild(name); title.appendChild(time);
            const description = document.createElement('p'); description.className = 'activity-detail';
            content.appendChild(title); content.appendChild(description); row.appendChild(marker); row.appendChild(content);
            row.parts = {marker, name, time, description}; rows.push(row); list.appendChild(row);
          }
          row.dataset.status = step.status || 'complete';
          row.parts.marker.textContent = step.status === 'error' ? '!' : step.status === 'stopped' ? '■' : step.status === 'skipped' ? '–' : step.status === 'complete' ? '✓' : step.kind === 'tool' ? '›_' : step.kind === 'file' ? '▧' : step.kind === 'api' ? '↗' : '•';
          row.parts.name.textContent = step.label;
          row.parts.time.textContent = activityTime(step.atMs);
          row.parts.time.title = step.endMs === undefined ? 'Thời điểm bắt đầu' : 'Thực hiện trong ' + activityTime(step.endMs - step.atMs);
          row.parts.description.textContent = step.detail || '';
          row.parts.description.classList.toggle('hidden', !step.detail);
        };
        const addRow = (step) => paintRow(step, rows.length);
        data.steps.forEach(addRow);
        let running = live, timer = null;
        const refresh = () => {
          if (running) data.elapsedMs = Math.max(0, Date.now() - started);
          details.dataset.status = data.status;
          label.textContent = (running ? 'Đang hoạt động · ' : data.status === 'stopped' ? 'Đã dừng sau ' : data.status === 'error' ? 'Đã gặp lỗi sau ' : 'Đã hoạt động trong ') + activityTime(data.elapsedMs);
        };
        const tick = () => { refresh(); if (running) timer = setTimeout(tick, 1000); };
        tick();
        return {details, data,
          step(text, info = {}) {
            const now = Math.max(0, Date.now() - started);
            const index = info.id ? data.steps.findIndex((step) => step.id === info.id) : -1;
            if (index < 0 && (data.steps.at(-1)?.label === text || data.steps.length >= 40)) return;
            if (index < 0 && data.steps.at(-1)?.status === 'running' && data.steps.at(-1)?.kind === 'status') {
              const previous = data.steps.at(-1); previous.status = 'complete'; previous.endMs = now; paintRow(previous, data.steps.length - 1);
            }
            const step = index >= 0 ? data.steps[index] : {atMs: now};
            step.label = text.slice(0, 160); step.kind = info.kind || step.kind || 'status'; step.status = info.status || 'running';
            if (info.id) step.id = info.id;
            if (info.detail) step.detail = info.detail.slice(0, 240);
            if (step.status !== 'running') step.endMs = now;
            if (index >= 0) paintRow(step, index); else { data.steps.push(step); addRow(step); }
            refresh();
          },
          finish(status) {
            if (!running) return;
            data.elapsedMs = Math.max(0, Date.now() - started); running = false; clearTimeout(timer); data.status = status;
            data.steps.forEach((step, index) => { if (step.status === 'running') { step.status = status; step.endMs = data.elapsedMs; paintRow(step, index); } });
            refresh();
          }
        };
      }

      function revealReplyText(node, text) {
        const shown = node.textContent;
        if (!node.replyText || !text.startsWith(shown)) {
          node.textContent = '';
          const stable = document.createElement('span');
          node.appendChild(stable);
          node.replyText = {stable, recent: []};
        }
        const parts = node.replyText;
        const tail = text.slice(node.textContent.length);
        if (!tail) return;
        if (parts.recent.length === 4) {
          const first = parts.recent.shift();
          clearTimeout(first.wordTimer);
          parts.stable.textContent += first.textContent;
          first.remove();
        }
        const fresh = document.createElement('span');
        fresh.className = 'reply-text-in';
        const words = tail.match(/\s+|\S+\s*/g) || [];
        const spacing = Math.min(24, 1200 / Math.max(1, words.length - 1));
        words.forEach((word, index) => {
          const part = document.createElement('span'); part.className = 'reply-word'; part.textContent = word;
          part.style.setProperty('--word-delay', index * spacing + 'ms'); fresh.appendChild(part);
        });
        fresh.wordTimer = setTimeout(() => { fresh.textContent = tail; }, Math.max(0, words.length - 1) * spacing + 180);
        parts.recent.push(fresh); node.appendChild(fresh);
      }

      function createLiveAnswer(existing) {
        if (existing) return existing;
        const card = document.createElement('div');
        card.className = 'live-answer rounded-2xl rounded-tl-sm bg-white/[0.04] border border-white/[0.07] px-3.5 py-2.5';
        const body = document.createElement('div'); body.className = 'space-y-1.5';
        const files = document.createElement('div');
        const view = {card, body, text: '', attachments: [], timer: null, renderedFiles: '', followBottom: true};
        card.appendChild(body); card.appendChild(files);
        card.dataset.messageIndex = String(state.messages.length);
        answerStreamBox.appendChild(card);
        view.reveal = () => {
          if (view.revealed) return;
          view.revealed = true;
          view.header = createMessageHeader('Nusa AI', () => [view.text, view.errorText].filter(Boolean).join('\n\n'));
          card.insertBefore(view.header, body);
        };
        view.flush = () => {
          clearTimeout(view.timer); view.timer = null;
          const fileIds = view.attachments.map((file) => file.id).join(',');
          if (view.renderedText === view.text && fileIds === view.renderedFiles) {
            if (view.followBottom) answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
            syncScrollToLatest(); return;
          }
          if (view.text.trim() || view.attachments.length) nusaShell.classList.remove('is-waiting-answer');
          if (view.text.trim() || view.attachments.length) view.reveal();
          const textChanged = view.renderedText !== view.text;
          const blocks = textChanged ? parseAnswerBlocks(view.text) : [];
          for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i]; const node = body.children[i]; const previous = node?.nusaBlock;
            if (previous?.type === block.type && previous.language === block.language) {
              if (previous.text !== block.text) {
                previous.text = block.text;
                if (block.type === 'code') node.children[1].children[0].textContent = block.text;
                else revealReplyText(node, block.text.replace(/\*\*(.*?)\*\*/g, '$1'));
              }
            } else {
              const next = createAnswerBlock(block); next.classList.remove('stream-line'); next.nusaBlock = block;
              if (block.type !== 'code') { next.textContent = ''; revealReplyText(next, block.text.replace(/\*\*(.*?)\*\*/g, '$1')); }
              if (node) body.replaceChild(next, node); else body.appendChild(next);
            }
          }
          if (textChanged) while (body.children.length > blocks.length) body.lastElementChild.remove();
          view.renderedText = view.text;
          if (fileIds !== view.renderedFiles) {
            files.innerHTML = ''; files.appendChild(attachmentCards(view.attachments)); view.renderedFiles = fileIds;
          }
          if (view.followBottom) answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
          syncScrollToLatest();
        };
        view.update = () => { if (view.timer === null) view.timer = setTimeout(view.flush, 80); };
        return view;
      }

      function turnMessages(active) {
        const messages = active.baseMessages.map((message) => ({...message}));
        if (active.replaceAssistant) messages.pop();
        if (active.partial || active.outputs.length || active.errorText) messages.push({role: 'assistant', text: active.partial, ...(active.errorText ? {errorText: active.errorText} : {}), ...(active.outputs.length ? {attachments: active.outputs.slice()} : {}), ...(active.activityRun ? {activity: normalizeAnswerActivity(active.activityRun.data)} : {})});
        return messages;
      }

      function commitActiveTurn(active) {
        if (!active || active.chatId !== state.chatId) return;
        active.view?.flush();
        state.messages = turnMessages(active);
        saveChatHistory();
      }

      function discardPausedTurn() { state.pausedTurn = null; syncAiControl(); }

      function cancelActiveAi() {
        state.activeAi?.activityRun?.finish('stopped');
        if (state.activeAi) commitActiveTurn(state.activeAi);
        state.aiAbort?.abort(); state.aiAbort = null; state.activeAi = null;
      }

      stopAiBtn.addEventListener('pointerdown', () => { state.historyInteracting = true; clearCollapseTimer(); });
      stopAiBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        const paused = state.pausedTurn;
        if (paused && !state.aiAbort) {
          if (paused.version === state.requestId && !state.thinking) void submitAsk(paused.q, true, paused.stepByStep, null, {resume: paused});
          return;
        }
        const active = state.activeAi;
        if (!active || !state.aiAbort) return;
        state.requestId++;
        cancelActiveAi(); setThinking(false);
        state.historyInteracting = true;
        state.pausedTurn = {...active, version: state.requestId};

      });

      async function submitAsk(rawQuestion, isFollowUp = false, stepByStep = false, retryBubble = null, options = {}) {
        let q = rawQuestion.trim();
        const resume = options.resume;
        const attachments = resume ? [] : options.attachments || state.draftAttachments.slice();
        if (!q && attachments.length) q = 'Hãy xem các tệp đính kèm.';
        if ((!q && !resume) || state.thinking || state.aiAbort) return;
        stopSpeech(); discardPausedTurn();
        if (retryBubble) { state.historyInteracting = true; clearCollapseTimer(); retryBubble.remove(); }
        if (!resume && !attachments.length && !state.messages.length && !stepByStep && checkLiveMath(q)) { openMathCard(false); return; }
        const previousMessages = state.messages.slice();
        const finalPrompt = stepByStep ? 'Giải chi tiết từng bước bài toán sau một cách rõ ràng, ngắn gọn: ' + q : q;
        const user = {role: 'user', text: finalPrompt, ...(attachments.length ? {attachments} : {})};
        const baseMessages = resume ? state.messages.slice() : [...previousMessages, user];
        const prefix = resume?.partial || '';
        if (!resume) {
          askInput.value = ''; askInput.scrollLeft = 0;
          inlineMathGroup.classList.add('hidden'); inlineMathGroup.classList.remove('flex');
          state.draftAttachments = []; renderDraftAttachments();
          state.messages = baseMessages; saveChatHistory();
          clearStreamTimers(); removeWaitingPlaceholder();
          appendUserBubble(q, attachments);
          state.suppressAutoFocus = true; setMode('answer', false);
        }
        state.lastPrompt = q;
        const requestId = ++state.requestId;
        const controller = new AbortController();
        const view = createLiveAnswer(resume?.view);
        view.followBottom = true;
        const active = {q, stepByStep, chatId: state.chatId, baseMessages, prefix, partial: prefix,
          replaceAssistant: Boolean(resume && baseMessages.at(-1)?.role === 'assistant'),
          outputs: resume?.outputs?.slice() || [], view};
        view.activityRun?.details.remove();
        active.activityRun = createAnswerActivity(options.retry ? null : resume?.activityRun?.data);
        view.activityRun = active.activityRun; view.card.appendChild(active.activityRun.details);
        active.activityRun.step(options.retry ? 'Đang thử lại yêu cầu' : resume ? 'Đã tiếp tục yêu cầu' : 'Đã nhận yêu cầu');
        state.aiAbort = controller; state.activeAi = active;
        setThinking(true);
        const waiting = document.createElement('div'); waiting.id = 'nusaWaitingCard'; waiting.className = 'thinking-wait-bubble w-fit rounded-2xl border px-3.5 py-2';
        waiting.innerHTML = '<div class="thinking-wait-row" role="status" aria-label="Nusa is thinking"><span class="thinking-dot"></span><span class="thinking-dot"></span><span class="thinking-dot"></span></div>';
        if (!prefix) view.body.appendChild(waiting);
        answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
        requestAnimationFrame(() => {
          if (requestId === state.requestId && state.mode === 'answer' && view.followBottom) answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
        });
        const input = prefix || active.outputs.length ? [...baseMessages, {role: 'user', internal: true, text: 'Tiếp tục ngay từ chỗ câu trả lời trước bị dừng. Không lặp lại phần đã viết hoặc file đã gửi; giữ nguyên định dạng và khối code đang mở.'}] : baseMessages;
        const timeout = setTimeout(() => controller.abort(), 180000);
        try {
          await queryAI(input, controller.signal, (delta) => {
            if (requestId !== state.requestId) return;
            active.partial += delta; view.text = active.partial; view.update();
          }, (file) => {
            if (requestId !== state.requestId) return;
            active.outputs.push(file); view.attachments = active.outputs; view.update();
          }, (step, info) => { if (requestId === state.requestId) active.activityRun.step(step, info); });
          if (requestId !== state.requestId) return;
          if (!active.partial && !active.outputs.length) throw new Error('API không trả về nội dung.');
          active.activityRun.step('Đã nhận xong câu trả lời'); active.activityRun.finish('complete');
          removeWaitingPlaceholder(); commitActiveTurn(active); setThinking(false);
          void nameChatWithAi(state.chatId);
        } catch (err) {
          if (requestId !== state.requestId) return;
          active.activityRun.step(controller.signal.aborted ? 'Đã hết thời gian chờ' : 'Yêu cầu gặp lỗi'); active.activityRun.finish('error');
          active.errorText = controller.signal.aborted ? 'Đã hết thời gian chờ. Bạn có thể thử lại.' : 'Lỗi API: ' + err.message;
          removeWaitingPlaceholder(); commitActiveTurn(active); setThinking(false);
          const notice = document.createElement('div'); notice.className = 'text-[11px] text-rose-200/80 pt-1';
          notice.textContent = active.errorText;
          view.errorText = notice.textContent; view.reveal();
          const errorCard = document.createElement('div');
          errorCard.className = 'answer-error space-y-2';
          errorCard.appendChild(notice);
          const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Retry';
          retry.className = 'answer-retry px-2.5 py-1 rounded-lg bg-white/[0.08] hover:bg-white/[0.15] text-[11.5px] text-white/80';
          retry.addEventListener('pointerdown', () => { state.historyInteracting = true; clearCollapseTimer(); });
          retry.addEventListener('click', () => {
            state.historyInteracting = true;
            if (state.chatId !== active.chatId || requestId !== state.requestId || state.aiAbort) return;
            errorCard.remove();
            view.errorText = '';
            if (!view.text && !view.attachments.length) { view.header.remove(); view.revealed = false; }
            void submitAsk(q, true, stepByStep, null, {resume: active, retry: true});
          });
          errorCard.appendChild(retry); view.card.appendChild(errorCard);
          if (view.followBottom) answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
        } finally {
          clearTimeout(timeout);
          if (state.aiAbort === controller) { state.aiAbort = null; state.activeAi = null; syncAiControl(); }
        }
      }

      function createMessageHeader(sender, getTextFn) {
        const header = document.createElement('div');
        header.className = 'message-header flex items-center justify-between gap-3 w-full mb-1.5';
        const name = document.createElement('span');
        name.className = 'text-[10.5px] font-medium text-white/50';
        name.textContent = sender;
        header.appendChild(name);
        header.appendChild(createBubbleCopyBtn(getTextFn));
        return header;
      }

      function appendUserBubble(questionText, attachments = []) {
        const userWrap = document.createElement('div');
        userWrap.className = 'stream-line flex flex-col items-end gap-1 ml-auto w-fit min-w-0 max-w-[88%] rounded-2xl rounded-tr-sm bg-white/[0.11] border border-white/[0.12] px-3.5 py-2 text-[13.5px] leading-snug text-white';
        userWrap.dataset.userQuestion = questionText;
        userWrap.dataset.messageIndex = String(Math.max(0, state.messages.length - 1));

        const userBubble = document.createElement('div');
        userBubble.className =
          'w-full whitespace-pre-wrap [overflow-wrap:anywhere]';
        userBubble.textContent = questionText;

        userWrap.appendChild(createMessageHeader('You', () => questionText));
        if (attachments.length) {
          userWrap.classList.add('has-attachments');
          userWrap.appendChild(attachmentCards(attachments));
        }
        userWrap.appendChild(userBubble);
        answerStreamBox.appendChild(userWrap);
        return userWrap;
      }

      function showWaitingPlaceholder(questionText, isFollowUp = false, reuseQuestion = false) {
        clearStreamTimers();
        if (!isFollowUp) {
          answerStreamBox.innerHTML = '';
        }

        if (!reuseQuestion || !isFollowUpRenderedAlready(questionText)) {
          appendUserBubble(questionText);
        }

        const waitWrap = document.createElement('div');
        waitWrap.id = 'nusaWaitingCard';
        waitWrap.className = 'stream-line thinking-wait-bubble w-fit rounded-2xl rounded-tl-sm border px-3.5 py-2';
        waitWrap.innerHTML = `
          <div class="thinking-wait-row" role="status" aria-label="Nusa is thinking">
            <span class="thinking-dot"></span>
            <span class="thinking-dot"></span>
            <span class="thinking-dot"></span>
          </div>
        `;
        answerStreamBox.appendChild(waitWrap);
        state.manualEditRequested = false;
        state.suppressAutoFocus = true;
        blurShellInputs();
        setMode('answer', false);
        requestAnimationFrame(() => {
          answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
        });
      }

      function parseAnswerBlocks(rawText) {
        const blocks = [];
        let text = [];
        let code = null;
        const flushText = () => {
          const value = text.join('\n').trim();
          if (value) blocks.push({ type: 'text', text: value });
          text = [];
        };
        for (const line of rawText.replace(/\r\n?/g, '\n').split('\n')) {
          if (code) {
            const closing = line.match(/^ {0,3}(`+|~+)[ \t]*$/);
            if (closing && closing[1][0] === code.fence[0] && closing[1].length >= code.fence.length) {
              blocks.push({ type: 'code', language: code.language, text: code.lines.join('\n') });
              code = null;
            } else code.lines.push(line);
          } else {
            const opening = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
            if (opening) {
              flushText();
              code = { fence: opening[1], language: opening[2].trim().split(/\s+/)[0], lines: [] };
            } else text.push(line);
          }
        }
        if (code) blocks.push({ type: 'code', language: code.language, text: code.lines.join('\n') });
        flushText();
        return blocks;
      }

      function createAnswerBlock(block) {
        if (block.type !== 'code') {
          const p = document.createElement('p');
          p.className = 'stream-line nusa-answer-text text-white/92';
          p.textContent = block.text.replace(/\*\*(.*?)\*\*/g, '$1');
          return p;
        }
        const names = {
          python: 'Python', py: 'Python', javascript: 'JavaScript', js: 'JavaScript',
          typescript: 'TypeScript', ts: 'TypeScript', jsx: 'JSX', tsx: 'TSX',
          html: 'HTML', css: 'CSS', json: 'JSON', java: 'Java', c: 'C',
          cpp: 'C++', 'c++': 'C++', csharp: 'C#', cs: 'C#', 'c#': 'C#',
          bash: 'Bash', sh: 'Shell', shell: 'Shell', powershell: 'PowerShell', ps1: 'PowerShell',
          sql: 'SQL', rust: 'Rust', go: 'Go', golang: 'Go', php: 'PHP', ruby: 'Ruby',
          rb: 'Ruby', lua: 'Lua', swift: 'Swift', kotlin: 'Kotlin', dart: 'Dart',
          yaml: 'YAML', yml: 'YAML', xml: 'XML', markdown: 'Markdown', md: 'Markdown',
          text: 'Text', plaintext: 'Text', txt: 'Text'
        };
        const key = block.language.toLowerCase();
        const language = Object.hasOwn(names, key) ? names[key] : block.language || 'Code';
        const card = document.createElement('div');
        card.className = 'stream-line nusa-code';
        card.setAttribute('role', 'region');
        card.setAttribute('aria-label', language + ' code');
        const header = document.createElement('div');
        header.className = 'nusa-code-header';
        const label = document.createElement('span');
        label.className = 'nusa-code-label';
        label.textContent = language;
        header.appendChild(label);
        header.appendChild(createBubbleCopyBtn(() => block.text));
        const download = document.createElement('button'); download.type = 'button';
        download.className = 'px-2 py-1 rounded-md text-white/75 hover:bg-white/10'; download.textContent = '↓';
        download.title = 'Tải ' + sourceFilename(block.language); download.setAttribute('aria-label', download.title);
        download.addEventListener('click', () => downloadTextFile(block.text, sourceFilename(block.language)));
        header.appendChild(download);
        const pre = document.createElement('pre');
        pre.className = 'thin-scroll';
        const code = document.createElement('code');
        code.textContent = block.text;
        pre.appendChild(code);
        card.appendChild(header);
        card.appendChild(pre);
        return card;
      }

      function streamAnswerLines(rawText, appendToThread = false, userQuestionText = '', restoring = false, attachments = [], activity = null, errorText = '') {
        clearStreamTimers();
        removeWaitingPlaceholder();

        if (!appendToThread) {
          answerStreamBox.innerHTML = '';
        }
        if (userQuestionText && !isFollowUpRenderedAlready(userQuestionText)) {
          appendUserBubble(userQuestionText);
        }

        const blocks = parseAnswerBlocks(rawText);

        const replyGroup = document.createElement('div');
        replyGroup.className =
          'space-y-2 rounded-2xl rounded-tl-sm bg-white/[0.04] border border-white/[0.07] px-3.5 py-2.5';

        const replyLinesBox = document.createElement('div');
        replyLinesBox.className = 'space-y-1.5';

        replyGroup.appendChild(createMessageHeader('Nusa AI', () => [rawText, errorText].filter(Boolean).join('\n\n')));
        replyGroup.appendChild(replyLinesBox);
        if (normalizeAnswerActivity(activity)) {
          replyGroup.classList.remove('space-y-2'); replyGroup.classList.add('live-answer');
          replyGroup.appendChild(createAnswerActivity(activity, false).details);
        }
        if (attachments.length) replyGroup.appendChild(attachmentCards(attachments));
        answerStreamBox.appendChild(replyGroup);
        if (errorText) {
          const notice = document.createElement('div'); notice.className = 'text-[11px] text-rose-200/80'; notice.textContent = errorText; replyGroup.appendChild(notice);
          const retry = document.createElement('button'); retry.type = 'button'; retry.textContent = 'Retry'; retry.className = 'answer-retry px-2.5 py-1 rounded-lg bg-white/[0.08] text-[11.5px] text-white/80';
          const restoredChatId = state.chatId;
          const restoredMessage = state.messages.find(message => message.role === 'assistant' && message.text === rawText && message.errorText === errorText);
          retry.addEventListener('click', () => {
            if (state.aiAbort || state.chatId !== restoredChatId || state.messages.at(-1) !== restoredMessage) return;
            const question = state.messages.findLast(message => message.role === 'user')?.text;
            if (!question) return;
            replyGroup.remove();
            void submitAsk(question, true, false, null, {retry: true, resume: {partial: rawText, outputs: attachments}});
          });
          replyGroup.appendChild(retry);
        }

        let heightSyncScheduled = false;
        const scheduleHeightSync = () => {
          answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
          if (heightSyncScheduled) return;
          heightSyncScheduled = true;
          requestAnimationFrame(() => {
            heightSyncScheduled = false;
            answerStreamBox.scrollTop = answerStreamBox.scrollHeight;
            refreshSpringTargets();
          });
        };

        blocks.forEach((block, i) => {
          const reveal = () => {
            replyLinesBox.appendChild(createAnswerBlock(block));
            scheduleHeightSync();
          };
          if (restoring) reveal();
          else state.streamTimers.push(setTimeout(reveal, i * 85));
        });

        if (!restoring && (!userQuestionText || state.mode === 'answer')) {
          state.manualEditRequested = false;
          state.suppressAutoFocus = true;
          blurShellInputs();
          setMode('answer', false);
        }
        syncHistoryPill();
        scheduleHeightSync();
        return replyGroup;
      }

      function isFollowUpRenderedAlready(questionText) {
        return Array.from(answerStreamBox.children).some(
          (el) => el.dataset && el.dataset.userQuestion === questionText
        );
      }

      askInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitAsk(askInput.value, false, false);
        }
      });

      rightActionBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.mode === 'translate') {
          setMode('idle', false);
        } else {
          submitAsk(askInput.value, false, false);
        }
      });

      solveWithAiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const clean = (askInput.value || state.lastPrompt || '').replace(/=\s*$/, '').trim();
        if (!clean) return;
        submitAsk(clean, false, true);
      });

      // --- NEW CHAT ---
      sidebarNewChatBtn.addEventListener('click', (e) => {
        closeMediaViewer();
        closeGeneratedFiles();
        const abandonedFiles = state.draftAttachments;
        state.draftAttachments = []; renderDraftAttachments(); void discardUnusedFiles(abandonedFiles);
        attachmentNotice('');
        stopSpeech();
        reportMicStatus('');
        discardPausedTurn();
        cancelActiveAi();
        state.historyInteracting = false;
        e.stopPropagation();
        state.requestId++;
        state.chatId = crypto.randomUUID();
        clearCollapseTimer();
        clearStreamTimers();
        if (state.translateAbort) {
          state.translateAbort.abort();
          state.translateAbort = null;
        }
        setThinking(false);
        state.messages = [];
        saveChatHistory();
        state.lastPrompt = '';
        state.mathRaw = '';
        state.mathFullText = '';
        state.mathCompactText = '';
        state.showingFullDigits = false;
        state.dismissedWhileDrafting = false;
        state.suppressAutoFocus = false;
        state.manualEditRequested = true;
        state.pointerInside = true;
        answerStreamBox.style.minHeight = '';
        answerStreamBox.innerHTML = '';
        askInput.value = '';
        askInput.scrollLeft = 0;
        autoResizeAskInput();
        inlineMathGroup.classList.add('hidden');
        inlineMathGroup.classList.remove('flex');
        solveWithAiBtn.classList.add('hidden');
        toggleFullDigitsBtn.classList.add('hidden');
        syncHistoryPill();
        setMode('answer', false);
        requestAnimationFrame(() => {
          if (state.mode === 'answer') {
            askInput.focus({ preventScroll: true });
          }
        });
      });

      // --- PHÍM TẮT ---
      document.addEventListener('keydown', (e) => {
        if (!mediaViewer.classList.contains('hidden')) {
          if (e.key === 'Escape') { e.preventDefault(); closeMediaViewer(); }
          if (e.key === 'Tab') {
            e.preventDefault();
            const controls = [mediaViewerDownload, mediaViewerClose, ...mediaViewerBody.querySelectorAll('video')];
            const index = controls.indexOf(document.activeElement);
            controls[(index + (e.shiftKey ? -1 : 1) + controls.length) % controls.length].focus();
          }
          return;
        }
        if (e.key === 'Tab' && !generatedFilesPanel.classList.contains('hidden')) return;
        if (e.key === 'Escape' && !generatedFilesPanel.classList.contains('hidden')) {
          e.preventDefault(); closeGeneratedFiles(); generatedFilesBtn.focus({preventScroll: true}); return;
        }
        if (e.key === 'Escape' && !historyActionMenu.classList.contains('hidden')) {
          e.preventDefault();
          const anchor = historyMenuAnchor;
          closeHistoryMenu();
          anchor?.focus({ preventScroll: true });
          return;
        }
        if (e.code === 'Space' && e.altKey) {
          e.preventDefault();
          const next = state.mode === 'idle' ? 'ask' : 'idle';
          state.suppressAutoFocus = next !== 'ask';
          setMode(next, next === 'ask');
        } else if (e.key === 'Tab' && state.mode !== 'idle') {
          e.preventDefault();
          state.suppressAutoFocus = false;
          if (state.mode === 'translate') {
            setMode('ask', true);
          } else {
            setMode('translate', true);
            if (translateInput.value.trim()) queueTranslate(0);
          }
        } else if (e.key === 'Escape' && state.mode !== 'idle') {
          if (langDropdownPopover.classList.contains('is-open')) {
            closeLangDropdown();
          } else {
            setMode('idle', false);
          }
        }
      });

      const savedChat = state.chatHistory.find((chat) => chat.id === state.chatId);
      if (savedChat) {
        state.messages = savedChat.messages.map((m) => ({ ...m }));
        renderSavedChat();
        void nameChatWithAi(state.chatId);
      }
      renderChatSidebar();
      syncHistoryPill();
      refreshSpringTargets();
    })();
  </script>
</body>
</html>
